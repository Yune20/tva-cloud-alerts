<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TVA Cloud Dashboard</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
  .header { background: #161b22; padding: 16px 24px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { color: #58a6ff; font-size: 20px; }
  .header .time { color: #8b949e; font-size: 13px; }
  .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
  .card-header { padding: 12px 16px; background: #21262d; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
  .card-header .symbol { color: #58a6ff; font-weight: bold; font-size: 15px; }
  .card-header .price { color: #f0f6fc; font-size: 14px; }
  .card-header .change { font-size: 13px; padding: 2px 8px; border-radius: 4px; }
  .change.up { background: #1b4332; color: #95d5b2; }
  .change.down { background: #5c1a1a; color: #f4a261; }
  .chart { height: 200px; }
  .analysis { padding: 12px 16px; font-size: 12px; line-height: 1.6; color: #8b949e; border-top: 1px solid #30363d; max-height: 150px; overflow-y: auto; }
  .analysis strong { color: #c9d1d9; }
  .loading { text-align: center; padding: 60px; color: #8b949e; }
  .error { text-align: center; padding: 60px; color: #f85149; }
  .refresh-btn { background: #238636; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .refresh-btn:hover { background: #2ea043; }
  .auto-refresh { color: #8b949e; font-size: 12px; margin-left: 12px; }
</style>
</head>
<body>
<div class="header">
  <h1>TVA Cloud Dashboard</h1>
  <div>
    <button class="refresh-btn" onclick="loadData()">Refresh</button>
    <span class="auto-refresh">Auto-refresh: 5 min</span>
    <span class="time" id="updated-at">Loading...</span>
  </div>
</div>
<div class="container">
  <div id="status" class="loading">Dang tai du lieu...</div>
  <div id="grid" class="grid"></div>
</div>

<script>
const DATA_URL = 'https://raw.githubusercontent.com/Yune20/tva-cloud-alerts/master/cloud_data/dashboard.json';
const charts = {};

async function loadData() {
  const status = document.getElementById('status');
  const grid = document.getElementById('grid');
  
  try {
    const resp = await fetch(DATA_URL + '?t=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    
    document.getElementById('updated-at').textContent = 
      'Updated: ' + new Date(data.updated_at).toLocaleString('vi-VN');
    
    grid.innerHTML = '';
    status.style.display = 'none';
    
    for (const sym of data.symbols) {
      const card = createCard(sym);
      grid.appendChild(card);
      renderChart(sym);
    }
  } catch (e) {
    status.className = 'error';
    status.textContent = 'Loi tai du lieu: ' + e.message + ' - Chay GitHub Actions truoc';
  }
}

function createCard(sym) {
  const ohlcv = sym.ohlcv;
  const lastClose = ohlcv.close[ohlcv.close.length - 1];
  const prevClose = ohlcv.close[ohlcv.close.length - 2] || lastClose;
  const change = ((lastClose - prevClose) / prevClose * 100).toFixed(2);
  const isUp = change >= 0;
  
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-header">
      <span class="symbol">${sym.name}</span>
      <span class="price">${formatPrice(lastClose)}</span>
      <span class="change ${isUp ? 'up' : 'down'}">${isUp ? '+' : ''}${change}%</span>
    </div>
    <div class="chart" id="chart-${sanitize(sym.symbol)}"></div>
    <div class="analysis">${formatAnalysis(sym.analysis_text)}</div>
  `;
  return card;
}

function renderChart(sym) {
  const container = document.getElementById('chart-' + sanitize(sym.symbol));
  if (!container) return;
  
  const chart = LightweightCharts.createChart(container, {
    height: 200,
    layout: { background: { color: '#0d1117' }, textColor: '#8b949e' },
    grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
    rightPriceScale: { borderColor: '#30363d' },
    timeScale: { borderColor: '#30363d' },
  });
  
  const candleSeries = chart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350',
    borderVisible: false,
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
  });
  
  // Build time data (1h intervals)
  const now = Math.floor(Date.now() / 1000);
  const interval = 3600;
  const data = sym.ohlcv.close.map((_, i) => ({
    time: now - (sym.ohlcv.close.length - 1 - i) * interval,
    open: sym.ohlcv.open[i],
    high: sym.ohlcv.high[i],
    low: sym.ohlcv.low[i],
    close: sym.ohlcv.close[i],
  }));
  
  candleSeries.setData(data);
  chart.timeScale().fitContent();
  
  charts[sym.symbol] = chart;
}

function formatPrice(p) {
  if (p >= 1000) return p.toLocaleString('en-US', { maximumFractionDigits: 2 });
  if (p >= 1) return p.toFixed(2);
  return p.toFixed(4);
}

function formatAnalysis(text) {
  return text
    .replace(/\*/g, '<strong>')
    .replace(/\n/g, '<br>')
    .replace(/━+/g, '<hr style="border:none;border-top:1px solid #30363d;margin:4px 0">');
}

function sanitize(s) {
  return s.replace(/[^a-zA-Z0-9]/g, '_');
}

// Load + auto refresh every 5 min
loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
